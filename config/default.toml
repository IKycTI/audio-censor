# Относительные пути в этом файле (словарь, модель, сокет, логи, метрики) отсчитываются
# от каталога, где лежит сам конфиг, а не от текущего каталога
[audio]
# строка: имя устройства захвата (список: --show-device input), либо "default" —
# устройство по умолчанию в системе. Linux + PipeWire: "PipeWire Sound Server"
input_device = "default"
# строка: имя выходного (виртуального) устройства (список: --show-device output), либо "default"
output_device = "default"
# число: частота дискретизации, Гц (напр. 16000, 44100, 48000). 48000 — родная частота
# PipeWire и обычный формат WASAPI на Windows, другие там устройство может не принять
sample_rate = 48000
# число: количество каналов (1 = моно, 2 = стерео)
channels = 2
# строка: формат сэмпла (`I8`, `I16`, `I32`, `I64`, `U8`, `U16`, `U32`, `U64`, `F32`, `F64` — по возможностям устройства)
sample_format = "F32"

[buffer]
# число: ёмкость кольцевого буфера в миллисекундах
ring_capacity_ms = 10000
# число: длительность буфера отложенного аудио (компромисс латентность/точность)
delay_ms = 5000

[decision]
# строка: путь к словарю запрещённых слов (json)
words_dict_path = "banned_words.json"
# число: максимально допустимое расстояние Левенштейна (общее для всех слов)
max_distance = 1

[framing]
# число: длительность одного чанка для распознавателя, мс
chunk_size_ms = 100

[recognition]
# строка: путь к каталогу с моделью распознавания
model_path = "../models/vosk-model-ru-0.22"
# булево: ловить слова по частичным гипотезам, не дожидаясь конца фразы.
# false — слова приходят только после паузы в речи, через секунды после звучания;
# true — сразу, но гипотеза может измениться (возможны ложные срабатывания)
partial_results = false
# число (0.0–1.0): минимальная уверенность слова, ниже которой оно не цензурируется;
# 0.0 — цензурировать всё распознанное
min_confidence = 0.0

[masking]
# строка: способ маскирования ("Silence" | "Beep" | "MuteAttenuate"), с заглавной буквы
strategy = "Beep"
# число: частота бипа в Гц, если strategy = "Beep"; меньше половины sample_rate
beep_frequency_hz = 1000
# число (0.0–1.0): громкость бипа относительно полной шкалы, если strategy = "Beep"
amplitude = 0.3
# число (≤ 0): уровень приглушения в дБ, если strategy = "MuteAttenuate";
# -20 — в 10 раз тише, -30 — примерно в 30 раз
attenuation_db = -30
# число: запас по времени до/после найденного слова, добавляемый к маске, мс;
# покрывает неточность таймстемпов Vosk на краях слова
padding_ms = 50

[control]
# булево: включён ли интерфейс управления демоном на лету
enabled = true
# строка: путь к сокету управления; пусто — $XDG_RUNTIME_DIR/audio-censor.sock,
# на Windows — именованный канал \\.\pipe\audio-censor-<пользователь> (свой путь там
# тоже должен начинаться с \\.\pipe\). На Unix путь не длиннее ~100 символов (sun_path)
socket_path = ""

[logging]
# строка: уровень логирования ("error" | "warn" | "info" | "debug" | "trace")
level = "info"
# строка: каталог логов — на каждый запуск файл <время запуска UTC>.log
# и ссылка latest.log на текущий; пусто — вывод в stdout
dir = "../logs"

[metrics]
# булево: включён ли сбор метрик
enabled = true
# число: как часто логировать метрики, мс; 0 — не логировать периодически
export_interval_ms = 10000
# строка: каталог метрик — <время запуска UTC>.metrics.json (при остановке и по команде
# save-metrics) и сводка всех запусков sessions.jsonl; пусто — не сохранять
dir = "../logs"
