[audio]
# строка: имя устройства захвата, либо "default" для автовыбора
input_device = "default"
# строка: имя выходного (виртуального) устройства, либо "default"
output_device = "default"
# число: частота дискретизации, Гц (напр. 16000, 44100, 48000)
sample_rate = 44100
# число: количество каналов (1 = моно, 2 = стерео)
channels = 1
# строка: формат сэмпла ("i16" | "f32" | "u16" — по возможностям устройства)
sample_format = "f32"

[buffer]
# число: ёмкость входного кольцевого буфера в миллисекундах
input_ring_capacity_ms = 1000
# число: ёмкость выходного кольцевого буфера в миллисекундах
output_ring_capacity_ms = 1000
# число: длительность буфера отложенного аудио (компромисс латентность/точность)
delay_ms = 1000
# строка: политика при переполнении ("DropOldest" | "DropNewest" | "Block")
overflow_policy = "DropOldest"

[decision]
# строка: путь к словарю запрещённых слов (json)
words_dict_path = "config/banned_words.json"
# число: максимально допустимое расстояние Левенштейна (общее для всех слов)
max_distance = 1

[framing]
# число: длительность одного чанка для распознавателя, мс
chunk_size_ms = 100
# число: перекрытие соседних чанков, мс (0 = без перекрытия)
overlap_ms = 0

[recognition]
# строка: путь к каталогу с моделью распознавания
model_path = "models/vosk-model-ru-0.22"
# строка: код языка модели (напр. "RU", "EN")
language = "RU"
# булево: использовать ли промежуточные (частичные) гипотезы распознавания
partial_results = false
# число (0.0–1.0): минимальная уверенность слова, ниже которой оно игнорируется
min_confidence = 0.0
# булево: учитывать регистр при сравнении
case_sensitive = false

[masking]
# строка: способ маскирования ("Silence" | "Beep" | "MuteAttenuate")
strategy = "Silence"
# число: частота бипа, если strategy = "beep"
beep_frequency_hz = 0
# число: уровень приглушения в дБ, если strategy = "mute_attenuate"
attenuation_db = 0
# число: запас по времени до/после найденного слова, добавляемый к маске
padding_ms = 0

[control]
# булево: включён ли интерфейс управления демоном на лету
enabled = false
# строка: путь к локальному сокету (Unix) или имя пайпа (Windows)
socket_path = ""

[logging]
# строка: уровень логирования ("error" | "warn" | "info" | "debug" | "trace")
level = "info"
# строка (опционально): путь к файлу лога; если пусто — вывод в stdout
file_path = ""

[metrics]
# булево: включён ли сбор метрик
enabled = false
# число: как часто публиковать/логировать метрики
export_interval_ms = 0
