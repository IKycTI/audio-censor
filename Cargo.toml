[package]
name = "audio-censor"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.17.3"
# termination — ловить и SIGTERM (так systemd останавливает службу), а не только Ctrl+C
ctrlc = { version = "3.5.2", features = ["termination"] }
ringbuf = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.4"
distance = "0.4.0"
clap = { version = "4.6.6", features = ["derive"] }
vosk = "0.3.1"
dasp = "0.11.0"
