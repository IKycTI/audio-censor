[package]
name = "audio-censor"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.17.3"
# termination — ловить и SIGTERM (так systemd останавливает службу), а не только Ctrl+C
ctrlc = { version = "3.5.2", features = ["termination"] }
ringbuf = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1.1.4"
distance = "0.4.0"
clap = { version = "4.6.6", features = ["derive"] }
vosk = "0.3.1"
# control-сокет: Unix-сокет на Linux, именованный канал на Windows
interprocess = "2.4.6"
dasp = "0.11.0"

# Только для сборки под Windows: import library для libvosk.dll из колеса vosk (build.rs).
# Зависимость сборочная, а не целевая, поэтому собирается и на Linux
[build-dependencies]
implib = "0.6.0"
object = { version = "0.39.1", default-features = false, features = ["read_core", "pe", "std"] }
